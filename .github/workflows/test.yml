name: Tests

on:
  push:
    # `main` is upstream's default; `master` is this fork's. Without the second name CI never
    # ran on a push here at all — the fork has never had a branch called main.
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax-check all source files
        run: |
          for f in src/index.js src/lib/*.js src/commands/*.js src/daemon.js src/figma-client.js; do
            node --check "$f"
          done

  # Fork-only. The CLI job above runs on Linux and cannot see `swift-host/` at all, so the tool
  # Daniel actually uses was the one part with no CI. `swift build` compiles the AppKit code —
  # where every bug of the past week lived — and `CoreChecks` runs the ported cases, which need
  # no window and no Xcode.
  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift-host
    steps:
      - uses: actions/checkout@v4
      # Only the fetched dependencies, never `.build`. Compiled Swift artifacts record the
      # absolute path they were built at, so after the repository was renamed — the runner's
      # checkout moved from work/figma-cli to work/figma-claude — a restored `.build` failed the
      # whole job with "precompiled file ... was compiled with module cache path ...". The key
      # hashes Package.resolved, which had not changed, so the poisoned cache was a perfect hit.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('swift-host/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - run: swift --version
      - run: swift build
      - run: swift run CoreChecks
